<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body,#root{min-height:100%;background:#f0f2f5;}
body{-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;font-family:Arial,sans-serif;}
input,select,button,textarea{font-family:Arial,sans-serif;}
/* prevent iOS zoom */
input,select,textarea{font-size:16px!important;}
button{font-size:14px!important;}
input[type="date"]{-webkit-appearance:none;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:#e8eaed;}
::-webkit-scrollbar-thumb{background:#9aacbe;border-radius:3px;}

/* ── FORM LIGHT THEME ── */
.fcard{background:#fff;border:1px solid #d0d8e4;border-radius:10px;padding:14px 16px;}
.flabel{font-size:10px;font-weight:700;color:#4a6080;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px;display:block;}
.finp{background:#f8f9fb;border:1.5px solid #c8d4e0;border-radius:6px;color:#1a2a3a;
  padding:0 10px;outline:none;width:100%;display:block;transition:border-color .15s;}
.finp:focus{border-color:#3a6aaa;background:#fff;}
.finp-sm{font-size:11px!important;padding:0 2px!important;letter-spacing:0;}
.finp-sm::placeholder{font-size:10px;color:#b0bcc8;}
.finp.err{border-color:#c0392b!important;}
.finp-time{background:#f8f9fb;border:1.5px solid #c8d4e0;border-radius:6px;color:#1a2a3a;
  padding:0 10px;outline:none;transition:border-color .15s;font-family:Arial,sans-serif;
  font-size:16px!important;font-weight:700;letter-spacing:1px;text-align:center;width:90px;height:44px;}
.finp-time:focus{border-color:#3a6aaa;background:#fff;}
.finp-time.err{border-color:#c0392b!important;}
.finp-time::placeholder{color:#b0bcc8;font-weight:400;}

/* Radio-select toggle buttons */
.sel-btn{height:38px;border:1.5px solid #c8d4e0;background:#f8f9fb;color:#4a6080;
  padding:0 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
  font-family:Arial,sans-serif;white-space:nowrap;transition:all .15s;display:flex;
  align-items:center;gap:6px;}
.sel-btn.active{background:#1a3a6e;border-color:#3a6aaa;color:#fff;}
.sel-btn:hover:not(.active){background:#e8f0f8;border-color:#3a6aaa;}
.sel-btn .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.sel-btn.active .dot::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff;display:block;}
.auto-badge{font-size:9px;background:"rgba(255,255,255,0.2)";color:#a0c8ff;
  border:1px solid #3a6aaa;border-radius:3px;padding:"1px 4px";margin-left:4px;}
.ac-btn{height:40px;border:1.5px solid #c8d4e0;background:#f8f9fb;color:#4a6080;
  padding:0 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
  font-family:Arial,sans-serif;white-space:nowrap;transition:all .15s;}
.ac-btn.sel{background:#1a3a6e;border-color:#3a6aaa;color:#fff;}
.ac-btn:hover:not(.sel){background:#e8f0f8;border-color:#3a6aaa;}

/* ── LOGBOOK TABLE — light, iPad fit ── */
.lb-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.lb-table-screen{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0;}
.lb-table-screen th,.lb-table-screen td{
  border:1px solid #c8d4e0;padding:4px 3px;text-align:center;vertical-align:middle;
  font-family:Arial,sans-serif;overflow:hidden;white-space:nowrap;}
.lb-table-screen th{font-size:9px;font-weight:700;color:#1a2a3a;background:#dce8f4;line-height:1.2;}
.lb-table-screen th.sub{background:#eef4f9;font-size:8px;color:#2a3a5a;}
.lb-table-screen td{font-size:11px;color:#000080;background:#fff;}
.lb-table-screen tr:hover td{background:#eef4fb;}
.lb-table-screen td.night{color:#0000cc;font-weight:700;}
.lb-table-screen td.day{color:#5a3a00;font-weight:700;}
.lb-table-screen td.total{color:#00004a;font-weight:700;font-size:12px;}
.lb-table-screen .tot-row td{background:#dce8f4;font-weight:700;font-size:11px;color:#00004a;}
.lb-table-screen .prev-row td,.lb-table-screen .grand-row td{
  background:#e8f0f8;font-size:10px;font-weight:700;color:#1a2a3a;}
.lb-table-screen .prev-marker-row td{
  background:linear-gradient(180deg,#fff4d6,#fce8b8)!important;
  border-top:2px solid #d4a72c;border-bottom:2px solid #d4a72c;
  font-size:11px;font-weight:700;color:#5a3e00;}
.lb-table-screen .syn-th{background:#ede8f5!important;color:#3a1a6a!important;}
.lb-table-screen .syn-td{background:#faf8fd;color:#3a1a6a;}
.lb-table-screen .ins-th{background:#f0e8f5!important;color:#4a1a6a!important;}
.lb-table-screen .ins-td{background:#fdf8fd;}

/* Edit mode highlight */
.editing-row td{background:#fff8e8!important;outline:2px solid #f5a820;}

/* ── PRINT — A4 landscape, siyah başlık, lacivert data ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  html,body{background:white!important;margin:0;padding:0;}
  .no-print{display:none!important;}
  .print-show{display:block!important;}
  @page{size:A4 landscape;margin:4mm 5mm;}

  .p-page{font-family:Arial,sans-serif;font-size:6pt;color:#000080;width:100%;}

  .p-title{text-align:center;border-bottom:0.8pt solid #000;padding-bottom:1.5mm;margin-bottom:2mm;}
  .p-title-main{font-size:8.5pt;font-weight:700;color:#000;}
  .p-title-sub{font-size:6pt;color:#000;margin-top:0.8mm;}

  .p-tbl{width:100%;border-collapse:collapse;table-layout:fixed;}
  .p-tbl th,.p-tbl td{
    border:0.35pt solid #000;
    text-align:center;vertical-align:middle;
    overflow:hidden;padding:0.2mm 0.3mm;word-break:break-word;
    font-family:Arial,sans-serif;}
  /* Group headers — siyah yazı */
  .p-tbl .rg th{
    font-size:5pt;font-weight:700;height:4.5mm;
    background:#dce8f4!important;color:#000;line-height:1.2;padding:0.4mm 0.2mm;}
  /* Sub headers — siyah yazı */
  .p-tbl .rs th{
    font-size:4.5pt;font-weight:700;height:3.8mm;
    background:#eef4f9!important;color:#000;line-height:1.1;padding:0.2mm 0.2mm;}
  /* Data rows — lacivert */
  .p-tbl .rd td{font-size:6pt;height:5mm;color:#000080;padding:0.2mm 0.3mm;}
  /* Totals */
  .p-tbl .rt td{font-size:5.5pt;font-weight:700;height:4.5mm;
    background:#dce8f4!important;color:#000080;padding:0.2mm 0.3mm;}
  .p-tbl .rp td,.p-tbl .rr td{
    font-size:5pt;height:4mm;background:#e8f0f8!important;
    color:#000080;padding:0.2mm 0.3mm;}
  .c-n{color:#0000cc!important;font-weight:700;}
  .c-d{color:#5a3a00!important;font-weight:700;}
  .c-t{font-weight:700;color:#00004a!important;}
  .s-g{background:#ede8f5!important;}
  .s-s{background:#f5f2fa!important;}
  .s-d{background:#faf8fd!important;}
  .i-g{background:#f0e8f5!important;}

  /* Column widths — total 287mm (297-10mm margins) */
  .w1{width:12mm;}.w2{width:7mm;}.w3{width:10mm;}
  .w4{width:8mm;}.w5{width:8mm;}
  .w6{width:8mm;}.w7{width:8mm;}
  .w8{width:8mm;}.w9{width:8mm;}
  .w10{width:9mm;}.w11{width:9mm;}.w12{width:17mm;}
  .w13{width:6mm;}.w14{width:6mm;}
  .w15{width:8mm;}.w16{width:7mm;}
  .w17{width:8mm;}.w18{width:8mm;}.w19{width:7mm;}
  .w20{width:11mm;}
  .w21{width:11mm;}.w22{width:11mm;}.w23{width:10mm;}
  .w24{width:26mm;}
  /* 12+7+10+8+8+8+8+8+8+9+9+17+6+6+8+7+8+8+7+11+11+11+10+26 = 287mm ✓ */

  .p-foot{margin-top:2mm;font-size:5pt;color:#000;
    border-top:0.4pt solid #000;padding-top:1mm;display:flex;justify-content:space-between;}
}
</style>

});

const IATA_TO_ICAO={
  DWC:"OMDW", DXB:"OMDB", HKG:"VHHH", IST:"LTFM", SAW:"LTFJ",
  AYT:"LTAI", ESB:"LTAC", DLM:"LTBS", ADB:"LTBJ", GZP:"LTFE",
  TZX:"LTCG", DIY:"LTCC", ADA:"LTCA", YEI:"LTCE",
  LHR:"EGLL", AMS:"EHAM", FRA:"EDDF", CDG:"LFPG", MAD:"LEMD",
  FCO:"LIRF", VIE:"LOWW", ZRH:"LSZH", ATH:"LGAV",
  RUH:"OERK", BAH:"OBBI", KWI:"OKBK", TLV:"LLBG", CAI:"HECA",
  JFK:"KJFK", LAX:"KLAX", NRT:"RJTT", HND:"RJTT", SIN:"WSSS",
  AUH:"OMAA", DOH:"OTHH",
};
function toIcao(code){
  if(!code) return "";
  const c=code.toUpperCase().trim();
  if(c.length===4 && AP[c]) return c;              // zaten ICAO
  if(c.length===3 && IATA_TO_ICAO[c]) return IATA_TO_ICAO[c]; // IATA→ICAO çevir
  return c; // bilinmiyorsa olduğu gibi bırak (sabit eşik hesaplamasına düşer)
}


// ── SUN CALC (Jean Meeus — unchanged from v1/v2/v3) ───────────────────────────
function sunTimes(ds,lat,lon){
  const[y,mo,d]=ds.split("-").map(Number);
  const JD=367*y-Math.floor(7*(y+Math.floor((mo+9)/12))/4)+Math.floor(275*mo/9)+d+1721013.5;
  const T=(JD-2451545)/36525;
  const L0=(280.46646+36000.76983*T)%360;
  const M=Math.PI/180*((357.52911+35999.05029*T-.0001537*T*T)%360);
  const C=(1.914602-.004817*T-.000014*T*T)*Math.sin(M)+(.019993-.000101*T)*Math.sin(2*M)+.000289*Math.sin(3*M);
  const dec=Math.asin(Math.sin(Math.PI/180*(23.439291-.013004*T))*Math.sin(Math.PI/180*(L0+C)));
  const cosH=(Math.sin(Math.PI/180*-.8333)-Math.sin(Math.PI/180*lat)*Math.sin(dec))/(Math.cos(Math.PI/180*lat)*Math.cos(dec));
  if(Math.abs(cosH)>1)return cosH>1?{pn:true}:{pd:true};
  const H=180/Math.PI*Math.acos(cosH);
  const eot=(-.000075+.001868*Math.cos(T*2*Math.PI/365.25)-.032077*Math.sin(T*2*Math.PI/365.25)-.014615*Math.cos(2*T*2*Math.PI/365.25)-.04089*Math.sin(2*T*2*Math.PI/365.25))*229.18;
  return{sr:Math.round(720-4*lon-eot-H*4),ss:Math.round(720-4*lon-eot+H*4)};
}
function pt(s){if(!s||s==="")return null;const[h,m]=s.split(":").map(Number);return isNaN(h)||isNaN(m)?null:h*60+m;}
function hhmm(m){if(!m||m<=0)return"00:00";return`${String(Math.floor(Math.abs(m)/60)).padStart(2,"0")}:${String(Math.round(Math.abs(m)%60)).padStart(2,"0")}`;}
// Seçilmeyen pilot time/function alanları için: 0 ise boş döndür
function hhmmBlank(m){if(!m||m<=0)return"";return hhmm(m);}

// ── KULLANICI TANIMLI MEYDANLAR (AP listesinde olmayanlar için) ───────────────
// Versiyon bağımsız, paylaşılan bir anahtarda saklanır: bir kez girilen meydan
// tüm versiyonlarda ve tüm uçuşlarda geçerli olur.
const CUSTOM_AP_KEY="logbook_custom_airports";
function loadCustomAirports(){
  try{const s=localStorage.getItem(CUSTOM_AP_KEY);return s?JSON.parse(s):{};}catch{return{};}
}
function saveCustomAirports(obj){
  try{localStorage.setItem(CUSTOM_AP_KEY,JSON.stringify(obj));}catch{}
}
// Koordinat formatı: N4727.7E01916.6  → (N/S)DDMM.m (E/W)DDDMM.m
function parseCoord(str){
  const m=String(str||"").toUpperCase().replace(/[\s,]/g,"").match(/^([NS])(\d{2})(\d{2}(?:\.\d+)?)([EW])(\d{3})(\d{2}(?:\.\d+)?)$/);
  if(!m) return null;
  const latD=+m[2],latM=+m[3],lonD=+m[5],lonM=+m[6];
  if(latM>=60||lonM>=60||latD>90||lonD>180) return null;
  const lat=(latD+latM/60)*(m[1]==="S"?-1:1);
  const lon=(lonD+lonM/60)*(m[4]==="W"?-1:1);
  return {lat:Math.round(lat*10000)/10000,lon:Math.round(lon*10000)/10000};
}
function getAirport(code){
  const c=toIcao(code);
  if(!c) return null;
  if(AP[c]) return AP[c];
  const custom=loadCustomAirports();
  if(custom[c]) return custom[c];
  return null;
}
// Bir uçuş kaydının kalkış/varış meydanlarından AP'de VE kullanıcı tablosunda
// olmayanları döndürür — kayıt eklenmeden önce kontrol etmek için kullanılır.
function missingAirports(r){
  const missing=[];
  const dc=toIcao(r.from),ac=toIcao(r.to);
  if(dc && dc.length>=3 && !getAirport(dc)) missing.push(dc);
  if(ac && ac.length>=3 && ac!==dc && !getAirport(ac)) missing.push(ac);
  return missing;
}

// ── FLIGHT CALC (per-minute interpolation — v1 bug fix preserved) ─────────────
function calcFlight(r){
  const off=pt(r.depTime),on=pt(r.arrTime);
  if(off===null||on===null)return{total:0,night:0,day:0,ldgDay:0,ldgNight:0};
  let total=on-off;if(total<0)total+=1440;if(!total)return{total:0,night:0,day:0,ldgDay:0,ldgNight:0};
  const dep=getAirport(r.from),arr=getAirport(r.to);
  if(!dep&&!arr){
    let night=0;for(let i=0;i<total;i++){const t=(off+i)%1440;if(t>=1200||t<360)night++;}
    return{total,night,day:total-night,ldgDay:0,ldgNight:parseInt(r.ldgs)||1};
  }
  let night=0;
  for(let i=0;i<total;i++){
    const t=(off+i)%1440;const frac=total>1?i/(total-1):0;
    const lat=dep&&arr?dep.lat+frac*(arr.lat-dep.lat):dep?dep.lat:arr.lat;
    const lon=dep&&arr?dep.lon+frac*(arr.lon-dep.lon):dep?dep.lon:arr.lon;
    if(!r.date){if(t>=1200||t<360)night++;continue;}
    const s=sunTimes(r.date,lat,lon);
    if(s.pn){night++;continue;}if(s.pd)continue;
    const ns=((s.ss+30)%1440+1440)%1440,ne=((s.sr-30)%1440+1440)%1440;
    if(ns>ne){if(t>=ns||t<ne)night++;}else{if(t>=ns&&t<ne)night++;}
  }
  const endT=(off+total)%1440;
  const endLat=arr?arr.lat:dep.lat,endLon=arr?arr.lon:dep.lon;
  let nightLdg=false;
  if(r.date){
    const se=sunTimes(r.date,endLat,endLon);
    if(!se.pd&&!se.pn){
      const ns=((se.ss+30)%1440+1440)%1440,ne=((se.sr-30)%1440+1440)%1440;
      nightLdg=ns>ne?(endT>=ns||endT<ne):(endT>=ns&&endT<ne);
    }
  }
  const tl=parseInt(r.ldgs)||1;
  return{total,night,day:total-night,ldgDay:nightLdg?0:tl,ldgNight:nightLdg?tl:0};
}

// Tesseract.js'i sadece ihtiyaç duyulduğunda yükle (file:// altında da sayfa açılabilsin diye)
let _tesseractLoadPromise=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_tesseractLoadPromise) return _tesseractLoadPromise;
  _tesseractLoadPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>resolve(window.Tesseract);
    s.onerror=()=>reject(new Error('Tesseract.js yüklenemedi — internet bağlantınızı kontrol edin'));
    document.head.appendChild(s);
  });
  return _tesseractLoadPromise;
}

// PDF.js'i sadece PDF yüklendiğinde indir — metin katmanını doğrudan okumak için
let _pdfJsLoadPromise=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfJsLoadPromise) return _pdfJsLoadPromise;
  _pdfJsLoadPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror=()=>reject(new Error('PDF.js yüklenemedi — internet bağlantınızı kontrol edin'));
    document.head.appendChild(s);
  });
  return _pdfJsLoadPromise;
}

// PDF dosyasından tüm sayfaların metin katmanını çıkarır
async function extractPdfText(file){
  const pdfjsLib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let fullText="";
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    // Satır yapısını korumak için Y koordinatına göre grupla
    const items=content.items;
    let lastY=null, line="";
    const lines=[];
    for(const it of items){
      const y=it.transform[5];
      if(lastY!==null && Math.abs(y-lastY)>2){
        lines.push(line.trim());
        line="";
      }
      line+=it.str+" ";
      lastY=y;
    }
    if(line.trim()) lines.push(line.trim());
    fullText+=lines.join("\n")+"\n";
  }
  return fullText;
}

// ── GÖRÜNTÜ ÖN İŞLEME — OCR doğruluğunu artırmak için ────────────────────────
// ACARS ekranları genelde: düşük çözünürlük, yeşil-üstü-siyah kontrast, camdan
// yansıma/parlama içerir. Bu adımlar Tesseract'ın okumasını belirgin iyileştirir:
//   1) Büyütme (upscale) — küçük karakterleri OCR için büyütür
//   2) Gri tonlama — renk kanalı gürültüsünü eler
//   3) Kontrast germe (histogram stretch) — soluk/parlak alanları netleştirir
//   4) Adaptif eşikleme (thresholding) — siyah zemin üzerine beyaz yazıyı
//      net siyah-beyaz (binary) görüntüye çevirir, Tesseract için ideal format
function preprocessImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const srcUrl=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        URL.revokeObjectURL(srcUrl);
        // 1) Ölçekleme — küçük fotoğrafları büyüt (min 1400px), kamera fotoğraflarını (12MP+)
        //    küçült (max 1800px): iOS'ta dev canvas bellek tüketip sayfayı çökertiyordu.
        const MIN_W=1400, MAX_W=1800;
        const scale=img.width<MIN_W ? MIN_W/img.width : (img.width>MAX_W ? MAX_W/img.width : 1);
        const w=Math.round(img.width*scale);
        const h=Math.round(img.height*scale);

        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,0,0,w,h);
        img.src=""; // büyük görüntü belleğini bırak

        // Orijinal önizleme için küçük JPEG (tam boyutlu fotoğrafı <img> ile göstermeyelim)
        const tc=document.createElement('canvas');
        const tw=Math.min(700,w), th=Math.round(h*tw/w);
        tc.width=tw; tc.height=th;
        tc.getContext('2d').drawImage(canvas,0,0,tw,th);
        const origThumb=tc.toDataURL('image/jpeg',0.7);
        tc.width=tc.height=0;

        const imageData=ctx.getImageData(0,0,w,h);
        const px=imageData.data;

        // 2) Gri tonlama + parlaklık histogramı çıkar
        const gray=new Uint8ClampedArray(w*h);
        let minV=255, maxV=0;
        for(let i=0;i<px.length;i+=4){
          // Luminance formülü — insan gözü algısına yakın ağırlıklandırma
          const g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
          const gi=i/4;
          gray[gi]=g;
          if(g<minV)minV=g;
          if(g>maxV)maxV=g;
        }

        // 3) Kontrast germe (histogram stretch) — minV→0, maxV→255 aralığına yay
        const range=Math.max(1,maxV-minV);
        for(let i=0;i<gray.length;i++){
          gray[i]=((gray[i]-minV)/range)*255;
        }

        // 4) Basit adaptif eşikleme — ortalama parlaklığa göre eşik belirle
        let sum=0;
        for(let i=0;i<gray.length;i++) sum+=gray[i];
        const mean=sum/gray.length;
        // ACARS ekranları koyu zeminli olduğundan eşiği ortalamanın biraz altına çekiyoruz
        const threshold=mean*0.85;

        for(let i=0;i<gray.length;i++){
          const v=gray[i]>threshold?255:0; // beyaz metin/siyah zemin → siyah metin/beyaz zemin (Tesseract varsayılanı için ters çevir)
          const inv=255-v; // Tesseract siyah-yazı-beyaz-zemin ile daha iyi çalışır
          const di=i*4;
          px[di]=inv; px[di+1]=inv; px[di+2]=inv; px[di+3]=255;
        }

        ctx.putImageData(imageData,0,0);
        canvas.toBlob(blob=>{
          canvas.width=canvas.height=0; // canvas belleğini serbest bırak
          if(blob) resolve({blob,previewUrl:URL.createObjectURL(blob),origThumb});
          else reject(new Error('Görüntü işlenemedi'));
        },'image/png');
      }catch(err){ reject(err); }
    };
    img.onerror=()=>{URL.revokeObjectURL(srcUrl);reject(new Error('Görüntü yüklenemedi'));};
    img.src=srcUrl;
  });
}


//   9388-03        LHBP-LIMC
//   OUT - 07:11    OFF - 07:26    ON - 08:39    IN - 08:55
// ── ACARS OCR PARSER ───────────────────────────────────────────────────────────
// ACARS-FLT LOG ekran formatını ayrıştırır:
//   FLT NUM-DATE   ORIG-DEST
//   9388-03        LHBP-LIMC
//   OUT - 07:11    OFF - 07:26    ON - 08:39    IN - 08:55
function parseAcarsText(raw){
  const text=(raw||"").toUpperCase();
  const result={from:"",to:"",depTime:"",arrTime:"",day:null,flightNum:""};

  // Ekran başlıklarını (ORIG, DEST, FLT, TIME, BLOCK vb.) gerçek ICAO kodu sanmayı önler
  const HEADER_WORDS=new Set(["ORIG","DEST","FLT","NUM","DATE","TIME","FLIGHT","TIMES",
    "BLOCK","SENSORS","PRINT","RETURN","SUMMARY","CURR","LOG","ACARS","FOB",
    "OUT","OFF","ON","IN","FUEL","ETA","ATA","ETD","ATD"]);

  // "ORIG-DEST" başlığını bul — gerçek meydan çifti genelde bundan hemen sonra gelir
  const headerIdx=text.search(/ORIG\s*-?\s*DEST/);
  const searchZone=headerIdx>=0 ? text.slice(headerIdx+9) : text;

  function findAirportPair(zone){
    const re=/\b([A-Z]{4})\s*-\s*([A-Z]{4})\b/g;
    let m;
    while((m=re.exec(zone))!==null){
      const a=m[1], b=m[2];
      if(HEADER_WORDS.has(a)||HEADER_WORDS.has(b)) continue; // başlık kelimesi, atla
      return{from:a,to:b};
    }
    return null;
  }

  // Önce başlık sonrası bölgede ara, bulamazsa tüm metinde ara (header kelimeleri yine hariç)
  const pair=findAirportPair(searchZone)||findAirportPair(text);
  if(pair){ result.from=pair.from; result.to=pair.to; }

  // FLT NUM-DATE: rakam-rakam (örn 9388-03) — DATE kısmı ayın günü
  const fltMatch=text.match(/(\d{3,5})\s*-\s*(\d{1,2})(?!\d)/);
  if(fltMatch){ result.flightNum=fltMatch[1]; result.day=parseInt(fltMatch[2],10); }

  // OUT - HH:MM  (Block Off) — boşluk/tire varyasyonlarına toleranslı
  const outMatch=text.match(/\bOUT\b\s*[-–—:]*\s*(\d{1,2})[:.]?(\d{2})/);
  if(outMatch) result.depTime=`${outMatch[1].padStart(2,"0")}:${outMatch[2]}`;

  // IN - HH:MM  (Block On) — "IN" tek başına kelime olarak eşleşsin (MIN, WIN vb. karışmasın)
  const inMatch=text.match(/(?<![A-Z])\bIN\b\s*[-–—:]*\s*(\d{1,2})[:.]?(\d{2})/);
  if(inMatch) result.arrTime=`${inMatch[1].padStart(2,"0")}:${inMatch[2]}`;

  return result;
}

// ── CREW LOG TABLO PARSER ─────────────────────────────────────────────────────
// "ACT AIRLINES CREW LOG" formatındaki çok satırlı tabloyu ayrıştırır:
//   DD.MM.YYYY  Flight  ACREG  ACTYPE  CS  FLTNBR  DEP  HH:MM  ARR  HH:MM  BLOCK  CrewDetail
// Sadece "Flight" satırları alınır; "Pass"/"Standby"/diğer satırlar (block=00:00
// olan yolcu/deadhead kayıtları) otomatik olarak atlanır.
function parseCrewLogText(raw){
  const lines=(raw||"").split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  const flights=[];
  const skipped=[];

  // Ana desen: tarih + "Flight" + tescil + tip + C/S + FltNbr + Dep + saat + Arr + saat + Block + (Crew Detail)
  // Son grup (crewDetail) satırın geri kalanını yakalar — örn. "MI.SL.UE.TIA"
  const flightRe=/(\d{2})[.\/](\d{2})[.\/](\d{4})\s+FLIGHT\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+)\s+([A-Z]{3,4})\s+(\d{1,2}):(\d{2})\s+([A-Z]{3,4})\s+(\d{1,2}):(\d{2})\s+(\d{1,2}):(\d{2})\s*(.*)$/i;
  // "Pass" veya block T. 00:00 olan satırları tanımak için
  const passRe=/(\d{2})[.\/](\d{2})[.\/](\d{4})\s+(PASS|STANDBY|SBY|OFF|GRD)/i;

  for(const line of lines){
    const upper=line.toUpperCase();
    const m=upper.match(flightRe);
    if(m){
      const[,dd,mm,yyyy,acReg,acType,cs,fltNbr,dep,depH,depM,arr,arrH,arrM,blkH,blkM,crewDetail]=m;
      flights.push({
        date:`${yyyy}-${mm}-${dd}`,
        acType,reg:acReg,
        from:toIcao(dep),to:toIcao(arr),
        depTime:`${depH.padStart(2,"0")}:${depM}`,
        arrTime:`${arrH.padStart(2,"0")}:${arrM}`,
        flightNum:`${cs}${fltNbr}`,
        remarks:(crewDetail||"").trim(),
        ldgs:"1",
      });
      continue;
    }
    if(passRe.test(upper)){
      skipped.push(line); // Pass/Standby satırları bilerek atlanıyor
    }
  }
  return{flights,skipped,totalLines:lines.length};
}

function buildDateFromDay(day){
  if(!day||day<1||day>31)return"";
  const now=new Date();
  const y=now.getFullYear();
  const m=String(now.getMonth()+1).padStart(2,"0");
  const d=String(day).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

// ── TIME INPUT with HH:MM keyboard mask ───────────────────────────────────────
function TimeInput({value,onChange,hasError,placeholder="HH:MM"}){
  const[raw,setRaw]=useState(value||"");
  useEffect(()=>{ setRaw(value||""); },[value]);

  function handleChange(e){
    let v=e.target.value.replace(/[^0-9:]/g,"");
    // Auto-insert colon after 2 digits
    if(v.length===2&&!v.includes(":")&&raw.length<2) v=v+":";
    // Enforce HH:MM format length
    if(v.length>5) v=v.slice(0,5);
    setRaw(v);
    // Emit only valid complete times
    if(/^\d{2}:\d{2}$/.test(v)){
      const[h,m]=v.split(":").map(Number);
      if(h>=0&&h<=23&&m>=0&&m<=59) onChange(v);
      else onChange("");
    } else {
      onChange("");
    }
  }
  function handleBlur(){
    if(raw&&!/^\d{2}:\d{2}$/.test(raw)) setRaw("");
  }
  return(
    <input
      className={`finp-time${hasError?" err":""}`}
      value={raw}
      onChange={handleChange}
      onBlur={handleBlur}
      placeholder={placeholder}
      maxLength={5}
      inputMode="numeric"
      autoComplete="off"
    />
  );
}

      mp:a.mp+(pt(r.multiPilot)||0),
      pic:a.pic+(pt(r.pic)||0),co:a.co+(pt(r.coPilot)||0),
      dual:a.dual+(pt(r.dual)||0),ifr:a.ifr+(pt(r.ifr)||0),
      synTime:a.synTime+(pt(r.synTime)||0),
      instructorTime:a.instructorTime+(pt(r.instructorTime)||0),
    }),{total:0,night:0,day:0,ldgD:0,ldgN:0,se:0,me:0,mp:0,pic:0,co:0,dual:0,ifr:0,synTime:0,instructorTime:0});

  // Rapor penceresi tamamen referans tarihinden ÖNCE ise (geriye dönük rapor) PREVIOUS TOTAL eklenmez.
  const isFullyBackdatedReport=!!(refDate && af.to && af.to<=refDate);

  // PAGE TOTAL: seçili tarih aralığındaki uçuşlar (referans tarihi ve öncesi zaten
  // PREVIOUS TOTAL'e dahil olduğundan sayılmaz; geriye dönük raporda ise hepsi sayılır).
  const tots=useMemo(()=>{
    const countable=(refDate&&!isFullyBackdatedReport)
      ? filtered.filter(r=>!r.date || r.date>refDate)
      : filtered;
    return sumRows(countable);
  },[filtered,refDate,isFullyBackdatedReport]);

  // TOTAL: PREVIOUS TOTAL + referans tarihinden bitiş tarihine kadar TÜM uçuşlar
  // (başlangıç tarihi filtresi dikkate alınmaz; böylece aralık dışında kalan aylar da toplanır).
  const cumulative=useMemo(()=>{
    const base=computed.filter(r=>{
      if(af.to && r.date && r.date>af.to) return false;
      if(refDate && !isFullyBackdatedReport && r.date && r.date<=refDate) return false;
      return true;
    });
    return sumRows(base);
  },[computed,af.to,refDate,isFullyBackdatedReport]);

  const effectivePrevMin=isFullyBackdatedReport
    ? {total:0,day:0,night:0,se:0,me:0,mp:0,pic:0,co:0,dual:0,ifr:0,synTime:0,instructorTime:0,ldgD:0,ldgN:0}
    : prevMin;

  const grandTots=useMemo(()=>({
    total:effectivePrevMin.total+cumulative.total, day:effectivePrevMin.day+cumulative.day, night:effectivePrevMin.night+cumulative.night,
    se:effectivePrevMin.se+cumulative.se, me:effectivePrevMin.me+cumulative.me, mp:effectivePrevMin.mp+cumulative.mp,
    pic:effectivePrevMin.pic+cumulative.pic, co:effectivePrevMin.co+cumulative.co, dual:effectivePrevMin.dual+cumulative.dual,
    ifr:effectivePrevMin.ifr+cumulative.ifr, synTime:effectivePrevMin.synTime+cumulative.synTime,
    instructorTime:effectivePrevMin.instructorTime+cumulative.instructorTime,
    ldgD:effectivePrevMin.ldgD+cumulative.ldgD, ldgN:effectivePrevMin.ldgN+cumulative.ldgN,
  }),[effectivePrevMin,cumulative]);

  // Mevcut TOTAL (grandTots) değerini yeni dönemin PREVIOUS PAGE TOTAL'i yapar.
  // Böylece her yeni sayfada elle giriş tekrarlanmaz — bir önceki TOTAL otomatik devrolur.
  function copyTotalToPrevious(){
    const confirmMsg=lang==="tr"
      ?`Mevcut TOTAL (${hhmm(grandTots.total)}) yeni PREVIOUS PAGE TOTAL olarak kaydedilsin mi?\n\nBu işlem geri alınamaz — yapmadan önce mevcut logbook sayfanızı yazdırdığınızdan/kaydettiğinizden emin olun.`
      :`Save current TOTAL (${hhmm(grandTots.total)}) as the new PREVIOUS PAGE TOTAL?\n\nThis cannot be undone — make sure you've printed/saved the current logbook page first.`;
    if(!window.confirm(confirmMsg)) return;
    // Yeni kesim tarihi: logbook'taki en son (en büyük) uçuş tarihi — yoksa bugün
    const latestDate=rows.reduce((max,r)=>(r.date&&r.date>max?r.date:max),"");
    const newAsOf=latestDate||new Date().toISOString().slice(0,10);
    setPrevTotals({
      total:hhmm(grandTots.total), day:hhmm(grandTots.day), night:hhmm(grandTots.night),
      se:hhmm(grandTots.se), me:hhmm(grandTots.me), mp:hhmm(grandTots.mp),
      pic:hhmm(grandTots.pic), co:hhmm(grandTots.co), dual:hhmm(grandTots.dual),
      ifr:hhmm(grandTots.ifr), synTime:grandTots.synTime>0?hhmm(grandTots.synTime):"",
      instructorTime:grandTots.instructorTime>0?hhmm(grandTots.instructorTime):"",
      ldgD:String(grandTots.ldgD||""), ldgN:String(grandTots.ldgN||""),
      asOfDate:newAsOf,
    });
    showToast(lang==="tr"?"✓ Yeni sayfa için PREVIOUS PAGE TOTAL güncellendi":"✓ PREVIOUS PAGE TOTAL updated for new page");
  }

  function sf(k,v){setForm(p=>({...p,[k]:v}));setErrors(p=>({...p,[k]:null}));}

  function validate(){
    const e={};
    if(!form.date)e.date=t.req;
    if(!form.reg)e.reg=t.req;
    if(!form.from||form.from.length<3)e.from=t.min3;
    if(!form.to||form.to.length<3)e.to=t.min3;
    if(!form.depTime)e.depTime=t.req;
    if(!form.arrTime)e.arrTime=t.req;
    setErrors(e);return !Object.keys(e).length;
  }

  function addOrUpdate(skipApCheck){
    if(!validate())return;
    if(skipApCheck!==true){
      const miss=missingAirports({from:form.from,to:form.to});
      if(miss.length){
        const init={};miss.forEach(c=>{init[c]={name:"",coord:""};});
        setApPrompt(init);return;
      }
    }
    const calc=calcFlight({...form,from:form.from.toUpperCase(),to:form.to.toUpperCase()});
    const totalStr=hhmm(calc.total);
    const dayStr=hhmm(calc.day);
    // Çoklu seçim: her seçilen pilot time field = total
    const modes=Array.isArray(form.pilotTimeModes)?form.pilotTimeModes:["multiPilot"];
    const ptUpdate={singleSE:"",singleME:"",multiPilot:""};
    modes.forEach(k=>{ if(k in ptUpdate) ptUpdate[k]=totalStr; });
    // Tekli seçim: pilot fonksiyon = total
    const pfUpdate={pic:"",coPilot:"",dual:""};
    const fnMode=form.pilotFnMode||"pic";
    if(fnMode in pfUpdate) pfUpdate[fnMode]=totalStr;
    // IFR = gündüz süresi
    const entry={...form,
      from:form.from.toUpperCase(),to:form.to.toUpperCase(),
      acType:form.acType.toUpperCase(),reg:form.reg.toUpperCase(),
      ...ptUpdate,...pfUpdate,ifr:dayStr,
      // Bu bir uçuş kaydı — synthetic alanları boş kalır
      synDate:"",synType:"",synTime:""};
    if(editId){
      setRows(p=>p.map(r=>r.id===editId?{...entry,id:editId}:r));
      setEditId(null);
      showToast(t.updateOk);
    } else {
      setRows(p=>[...p,{...entry,id:Date.now()+Math.random()}]);
      showToast(t.addOk);
    }
    setForm({...emptyForm(),acType:form.acType,reg:form.reg,
      pilotTimeModes:form.pilotTimeModes,pilotFnMode:form.pilotFnMode});
  }

  // ── Synthetic Training — bağımsız kayıt ──────────────────────────────────────
  // Sadece Instructor + Synthetic (Tarih/Tip/Süre) sütunlarını doldurur.
  // Multi Pilot, Total, Landing, Op.Condition, IFR, PIC gibi uçuş alanlarına
  // hiç dokunmaz — bu alanlar bu kayıt için boş kalır.
  function validateSyn(){
    const e={};
    if(!synForm.synDate)e.synDate=t.req;
    if(!synForm.synType)e.synType=t.req;
    if(!synForm.synTime)e.synTime=t.req;
    setSynErrors(e);return !Object.keys(e).length;
  }
  function addSyntheticEntry(){
    if(!validateSyn())return;
    const entry={
      ...emptyForm(), // uçuş alanları tamamen boş/varsayılan
      date:synForm.synDate, // tabloda tarih sütununda görünsün diye
      acType:"",reg:synForm.reg?synForm.reg.toUpperCase():"",from:"",to:"",depTime:"",arrTime:"",
      pilotTimeModes:[],pilotFnMode:"",
      picName:"",pic:"",coPilot:"",dual:"",ifr:"",
      instructorName:synForm.instructorName,instructorTime:synForm.instructorTime,
      synDate:synForm.synDate,synType:synForm.synType,synTime:synForm.synTime,
      // Eğitmen adı Notlar (Kol.14 Remarks) sütununda da görünsün
      remarks:synForm.instructorName?`Instructor: ${synForm.instructorName}`:"",
      ldgs:"",
      isSynthetic:true, // satırın synthetic-only kayıt olduğunu işaretler
      id:Date.now()+Math.random(),
    };
    setRows(p=>[...p,entry]);
    setSynForm(emptySynForm());
    showToast(lang==="tr"?"✓ Synthetic training eklendi":"✓ Synthetic training added");
  }

  // ── VERSİYONLAR ARASI VERİ TAŞIMA ──────────────────────────────────────────
  function exportData(){
    const payload={rows,pilot,license,lang,prevTotals,exportedFrom:SK,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`${SK}_export_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(lang==="tr"?"✓ Dışa aktarıldı":"✓ Exported");
  }
  function applyImportedData(d){
    if(!d||!Array.isArray(d.rows)){
      showToast(lang==="tr"?"⚠ Geçersiz dosya":"⚠ Invalid file");
      return;
    }
    setRows(d.rows||[]);
    if(d.pilot!==undefined) setPilot(d.pilot);
    if(d.license!==undefined) setLicense(d.license);
    if(d.prevTotals) setPrevTotals(d.prevTotals);
    showToast(lang==="tr"?`✓ ${d.rows.length} kayıt içe aktarıldı`:`✓ ${d.rows.length} entries imported`);
  }
  function importFromFile(e){
    const file=e.target.files&&e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{ applyImportedData(JSON.parse(reader.result)); }
      catch{ showToast(lang==="tr"?"⚠ Dosya okunamadı":"⚠ Could not read file"); }
    };
    reader.readAsText(file);
    e.target.value="";
  }
  function importFromOtherVersion(){
    const candidates=findOtherVersionData();
    if(!candidates.length){
      showToast(lang==="tr"?"⚠ Bu tarayıcıda başka versiyon bulunamadı":"⚠ No other version found in this browser");
      return;
    }
    const best=candidates[0];
    if(!window.confirm(
      lang==="tr"
        ?`"${best.key}" içinde ${best.n} kayıt bulundu. Mevcut verinizin üzerine yazılacak. Devam edilsin mi?`
        :`Found ${best.n} entries in "${best.key}". This will overwrite your current data. Continue?`
    )) return;
    applyImportedData(best.data);
  }

  function startEdit(r){
    setForm({...r});
    setEditId(r.id);
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function cancelEdit(){setEditId(null);setForm(emptyForm());}
  function removeRow(id){
    if(editId===id){setEditId(null);setForm(emptyForm());}
    setRows(p=>p.filter(r=>r.id!==id));
    showToast(t.delOk);
  }
  function showToast(m){setToast(m);setTimeout(()=>setToast(null),2000);}

  const depInfo=AP[form.from?.toUpperCase()];
  const arrInfo=AP[form.to?.toUpperCase()];
  const prev=useMemo(()=>calcFlight({...form,from:form.from?.toUpperCase(),to:form.to?.toUpperCase()}),[form]);

  return(
    <div style={{minHeight:"100vh",background:"#f0f2f5",fontFamily:F,paddingTop:"env(safe-area-inset-top)"}}>

      {/* Toast */}
      {toast&&<div style={{position:"fixed",top:"calc(env(safe-area-inset-top)+12px)",left:"50%",transform:"translateX(-50%)",
        background:"#1a3a1a",color:"#5ecfa0",padding:"9px 20px",borderRadius:8,
        fontSize:13,zIndex:1000,whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,.2)",
        border:"1px solid #3a6a3a"}}>{toast}</div>}

      {/* REFERANS PREVIOUS TOTAL — inline tek satır logbook formatında giriş (modal DEĞİL) */}

      {/* ── HEADER ── */}
      <div className="no-print" style={{background:"linear-gradient(90deg,#1a2a3a,#1e3448,#1a2a3a)",
        borderBottom:"1px solid #2a4060",padding:"11px 16px",
        paddingLeft:"calc(16px + env(safe-area-inset-left))",
        paddingRight:"calc(16px + env(safe-area-inset-right))",
        display:"flex",alignItems:"center",gap:12}}>
        <svg width="26" height="26" viewBox="0 0 38 38" fill="none">
          <circle cx="19" cy="19" r="17" stroke="#4a9eff" strokeWidth="1.5"/>
          <polygon points="19,5 21,19 19,17 17,19" fill="#4a9eff"/>
          <polygon points="19,33 21,19 19,21 17,19" fill="#3d5a7a"/>
          <polygon points="5,19 19,17 17,19 19,21" fill="#3d5a7a"/>
          <polygon points="33,19 19,17 21,19 19,21" fill="#4a9eff"/>
          <circle cx="19" cy="19" r="2" fill="#4a9eff"/>
        </svg>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:8,letterSpacing:3,color:"#4a9eff",textTransform:"uppercase"}}>{t.appSub}</div>
          <div style={{fontSize:15,fontWeight:700,color:"#e8f4ff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.appTitle}</div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"flex-end",flexShrink:0,flexWrap:"wrap"}}>
          <HdrInput label={t.pilot} value={pilot} onChange={e=>setPilot(e.target.value)} ph="Ad Soyad" w={110}/>
          <HdrInput label={t.lic} value={license} onChange={e=>setLicense(e.target.value)} ph="TR.FCL.XXX" w={95}/>
          <div style={{display:"flex",border:"1px solid #2a4060",borderRadius:6,overflow:"hidden"}}>
            {["tr","en"].map(l=>(
              <button key={l} onClick={()=>setLang(l)}
                style={{background:lang===l?"#1a3a6e":"transparent",border:"none",
                  color:lang===l?"#e8f4ff":"#6a8aaa",padding:"5px 9px",cursor:"pointer",
                  fontSize:10,fontWeight:lang===l?700:400,fontFamily:F}}>
                {l.toUpperCase()}
              </button>
            ))}
          </div>
          <div style={{display:"flex",gap:4}}>
            <button onClick={importFromOtherVersion} title={lang==="tr"?"Bu tarayıcıdaki eski versiyondan otomatik al":"Auto-import from an older version in this browser"}
              style={{background:"transparent",border:"1px solid #3a6aaa",color:"#a0c8ff",
                padding:"5px 9px",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:F,whiteSpace:"nowrap"}}>
              ↻ {lang==="tr"?"Eski Versiyondan Al":"Import Old Version"}
            </button>
            <button onClick={()=>dataFileInputRef.current&&dataFileInputRef.current.click()} title={lang==="tr"?"Dışa aktarılan JSON dosyasından içe aktar":"Import from an exported JSON file"}
              style={{background:"transparent",border:"1px solid #3a6aaa",color:"#a0c8ff",
                padding:"5px 9px",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:F,whiteSpace:"nowrap"}}>
              📂 {lang==="tr"?"Dosyadan Al":"Import File"}
            </button>
            <button onClick={exportData} title={lang==="tr"?"Mevcut verileri JSON dosyası olarak indir":"Download current data as a JSON file"}
              style={{background:"transparent",border:"1px solid #3a6aaa",color:"#a0c8ff",
                padding:"5px 9px",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:F,whiteSpace:"nowrap"}}>
              ⬇ {lang==="tr"?"Dışa Aktar":"Export"}
            </button>
            <input ref={dataFileInputRef} type="file" accept="application/json,.json" onChange={importFromFile}
              style={{display:"none"}}/>
            <button onClick={()=>setShowExportText(JSON.stringify({rows,pilot,license,lang,prevTotals,exportedFrom:SK,exportedAt:new Date().toISOString()},null,2))}
              title={lang==="tr"?"Verileri metin olarak göster, kopyala":"Show data as text to copy"}
              style={{background:"transparent",border:"1px solid #3a6aaa",color:"#a0c8ff",
                padding:"5px 9px",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:F,whiteSpace:"nowrap"}}>
              📋 {lang==="tr"?"Metin Olarak Göster":"Show as Text"}
            </button>
            <button onClick={()=>setShowPasteImport("")} title={lang==="tr"?"Kopyaladığınız JSON metnini yapıştırarak içe aktarın":"Paste a copied JSON text to import"}
              style={{background:"transparent",border:"1px solid #3a6aaa",color:"#a0c8ff",
                padding:"5px 9px",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:F,whiteSpace:"nowrap"}}>
              📝 {lang==="tr"?"Metni Yapıştır":"Paste Text"}
            </button>
          </div>
        </div>
      </div>

      {showExportText&&(
        <div className="no-print" style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"#fff",borderRadius:10,padding:16,maxWidth:680,width:"100%",maxHeight:"85vh",display:"flex",flexDirection:"column"}}>
            <div style={{fontWeight:700,marginBottom:8,color:"#1a2a3a"}}>{lang==="tr"?"Tüm metni seçip kopyalayın:":"Select all and copy this text:"}</div>
            <textarea readOnly value={showExportText} onFocus={e=>e.target.select()}
              style={{flex:1,minHeight:300,fontFamily:"monospace",fontSize:11,padding:8,border:"1.5px solid #c8d4e0",borderRadius:6,resize:"none"}}/>
            <div style={{display:"flex",gap:8,marginTop:10,justifyContent:"flex-end"}}>
              <button onClick={async()=>{try{await navigator.clipboard.writeText(showExportText);showToast(lang==="tr"?"✓ Panoya kopyalandı":"✓ Copied");}catch{showToast(lang==="tr"?"⚠ Elle seçip kopyalayın":"⚠ Select and copy manually");}}}
                style={{background:"#1a3a6e",border:"none",color:"#fff",padding:"8px 16px",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:F}}>
                {lang==="tr"?"Panoya Kopyala":"Copy to Clipboard"}</button>
              <button onClick={()=>setShowExportText(null)}
                style={{background:"#eef1f5",border:"1px solid #c8d4e0",color:"#1a2a3a",padding:"8px 16px",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:F}}>
                {lang==="tr"?"Kapat":"Close"}</button>
            </div>
          </div>
        </div>
      )}

      {showPasteImport!==null&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:2000,
          display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"#fff",borderRadius:10,padding:16,maxWidth:680,width:"100%",maxHeight:"85vh",display:"flex",flexDirection:"column"}}>
            <div style={{fontWeight:700,marginBottom:8,color:"#1a2a3a"}}>
              {lang==="tr"?"Kopyaladığınız JSON verisini buraya yapıştırın:":"Paste the copied JSON data here:"}
            </div>
            <textarea value={showPasteImport} onChange={e=>setShowPasteImport(e.target.value)}
              placeholder={lang==="tr"?"{ ... }":"{ ... }"}
              style={{flex:1,minHeight:300,fontFamily:"monospace",fontSize:11,padding:8,
                border:"1.5px solid #c8d4e0",borderRadius:6,resize:"none"}}/>
            <div style={{display:"flex",gap:8,marginTop:10,justifyContent:"flex-end"}}>
              <button onClick={()=>{
                  try{
                    const d=JSON.parse(showPasteImport);
                    applyImportedData(d);
                    setShowPasteImport(null);
                  }catch{
                    showToast(lang==="tr"?"⚠ Geçersiz JSON metni":"⚠ Invalid JSON text");
                  }
                }}
                style={{background:"#1a3a6e",border:"none",color:"#fff",padding:"8px 16px",
                  borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:F}}>
                {lang==="tr"?"İçe Aktar":"Import"}
              </button>
              <button onClick={()=>setShowPasteImport(null)}
                style={{background:"#eef1f5",border:"1px solid #c8d4e0",color:"#1a2a3a",padding:"8px 16px",

              </button>

      {apPrompt&&(()=>{
        const codes=Object.keys(apPrompt);
        const valid=codes.every(c=>parseCoord(apPrompt[c].coord)!==null);
        const upd=(c,k,v)=>setApPrompt(p=>({...p,[c]:{...p[c],[k]:v}}));
        return(
        <div className="no-print" style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"#fff",borderRadius:10,padding:16,maxWidth:520,width:"100%",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontWeight:700,color:"#1a2a3a",marginBottom:6}}>
              {lang==="tr"?"Listede olmayan meydan":"Airport not in database"}
            </div>
            <div style={{fontSize:12,color:"#4a6080",marginBottom:12}}>
              {lang==="tr"
                ?"Gece/gündüz hesabı için koordinat gerekiyor. Bir kez girilir, sonraki uçuşlarda hatırlanır. Format: N4727.7E01916.6 (enlem DDMM.m, boylam DDDMM.m)."
                :"Coordinates are needed for night/day calculation. Entered once, remembered afterwards. Format: N4727.7E01916.6 (lat DDMM.m, lon DDDMM.m)."}
            </div>
            {codes.map(c=>(
              <div key={c} style={{border:"1px solid #d0d8e4",borderRadius:8,padding:10,marginBottom:10}}>
                <div style={{fontWeight:700,color:"#1a3a6e",marginBottom:6}}>{c}</div>
                <input className="finp" style={{height:40,marginBottom:6}} placeholder={lang==="tr"?"Meydan adı (örn. Kars)":"Airport name"}
                  value={apPrompt[c].name} onChange={e=>upd(c,"name",e.target.value)}/>
                <input className="finp" style={{height:40,fontFamily:"monospace",letterSpacing:1}} autoCapitalize="characters" autoCorrect="off" spellCheck="false"
                  placeholder="N4727.7E01916.6"
                  value={apPrompt[c].coord} onChange={e=>upd(c,"coord",e.target.value.toUpperCase())}/>
                {apPrompt[c].coord&&(()=>{const pc=parseCoord(apPrompt[c].coord);
                  return <div style={{fontSize:10,marginTop:4,color:pc?"#2a6a3a":"#a03030"}}>
                    {pc?`${pc.lat.toFixed(4)}, ${pc.lon.toFixed(4)}`:(lang==="tr"?"Format: N4727.7E01916.6 (N/S + DDMM.m, E/W + DDDMM.m)":"Format: N4727.7E01916.6 (N/S + DDMM.m, E/W + DDDMM.m)")}
                  </div>;})()}

            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>setApPrompt(null)}
                style={{background:"#eef1f5",border:"1px solid #c8d4e0",color:"#1a2a3a",padding:"8px 16px",borderRadius:6,cursor:"pointer",fontFamily:F}}>

                  <td>{hhmmBlank(tots.pic)}</td><td>{hhmmBlank(tots.co)}</td><td>{hhmmBlank(tots.dual)}</td>
                  <td>{tots.instructorTime>0?hhmm(tots.instructorTime):""}</td><td></td><td></td>
                  <td>{tots.synTime>0?hhmm(tots.synTime):""}</td>
                  <td></td><td className="no-print"></td>
                </tr>
                <tr className="prev-row">
                  <td colSpan={20} style={{textAlign:"right",paddingRight:8,fontSize:9,padding:"4px 8px"}}>
                    <span style={{color:"#7a8aaa"}}>
                      {t.prevTotal}: {prevMin.total>0?hhmm(prevMin.total):"—"}
                      {prevMin.instructorTime>0&&` · Instr: ${hhmm(prevMin.instructorTime)}`}
                      {prevTotals.asOfDate&&` (${lang==="tr"?"ref":"ref"}: ${prevTotals.asOfDate})`}
                    </span>
                    <button onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}
                      className="no-print"
                      style={{marginLeft:8,background:"#eef4fb",border:"1px solid #a0c0e0",color:"#1a3a6e",
                        borderRadius:4,cursor:"pointer",padding:"1px 8px",fontSize:9,fontFamily:F}}>
                      {lang==="tr"?"Düzenle ↑":"Edit ↑"}
                    </button>
                  </td>
                </tr>
                <tr className="grand-row">
                  <td colSpan={7} style={{textAlign:"right",paddingRight:8,fontSize:9}}>
                    {t.grandTotal}
                    <button onClick={copyTotalToPrevious}
                      className="no-print"
                      title={lang==="tr"?"Bu TOTAL değerini yeni dönemin PREVIOUS PAGE TOTAL'i yap":"Carry this TOTAL forward as next period's PREVIOUS PAGE TOTAL"}
                      style={{marginLeft:8,background:"#e8f5ee",border:"1px solid #a0d0b8",color:"#0a6a3a",
                        borderRadius:4,cursor:"pointer",padding:"1px 8px",fontSize:9,fontFamily:F}}>
                      {lang==="tr"?"→ Yeni Sayfaya Taşı":"→ Carry to New Page"}
                    </button>
                  </td>
                  <td>{hhmmBlank(grandTots.se)}</td><td>{hhmmBlank(grandTots.me)}</td>
                  <td>{hhmmBlank(grandTots.mp)}</td>
                  <td className="total">{hhmm(grandTots.total)}</td>
                  <td></td>
                  <td className="day">{grandTots.ldgD||""}</td>
                  <td className="night">{grandTots.ldgN||""}</td>
                  <td className="night">{hhmmBlank(grandTots.night)}</td>
                  <td>{hhmmBlank(grandTots.ifr)}</td>
                  <td>{hhmmBlank(grandTots.pic)}</td><td>{hhmmBlank(grandTots.co)}</td><td>{hhmmBlank(grandTots.dual)}</td>
                  <td>{grandTots.instructorTime>0?hhmm(grandTots.instructorTime):""}</td><td></td><td></td>
                  <td>{grandTots.synTime>0?hhmm(grandTots.synTime):""}</td>
                  <td></td><td className="no-print"></td>
                </tr>
              </tfoot>
            )}
          </table>
        </div>

        {/* ── PRINT TABLE ── */}
        <div className="print-show" style={{display:"none"}}>
          <div className="p-page">
            <div className="p-title">
              <div className="p-title-main">{t.ph_title} — {t.ph_sub}</div>
              <div className="p-title-sub">
                {t.pilot}: {pilot} &nbsp;|&nbsp; {t.lic}: {license}
                {(af.from||af.to)?` &nbsp;|&nbsp; ${t.filterFrom}: ${af.from||"—"} → ${af.to||"—"}`:""}
              </div>
            </div>
            <table className="p-tbl">
              <colgroup>
                <col className="w1"/><col className="w2"/><col className="w3"/>
                <col className="w4"/><col className="w5"/>
                <col className="w6"/><col className="w7"/>
                <col className="w8"/><col className="w9"/>
                <col className="w10"/><col className="w11"/><col className="w12"/>
                <col className="w13"/><col className="w14"/>
                <col className="w15"/><col className="w16"/>
                <col className="w17"/><col className="w18"/><col className="w19"/>
                <col className="w20"/>
                <col className="w21"/><col className="w22"/><col className="w23"/>
                <col className="w24"/>
              </colgroup>
              <thead>
                <tr className="rg">
                  <th>1<br/>{t.g1}</th>
                  <th>2<br/>{t.s2}</th>
                  <th>{t.s3}</th>
                  <th>3<br/>{t.s4}</th>
                  <th>{t.s5}</th>
                  <th>4<br/>{t.s6}</th>
                  <th>{t.s7}</th>
                  <th>5<br/>{t.s8}</th>
                  <th>{t.s9}</th>
                  <th>6<br/>{t.g6}</th>
                  <th>7<br/>{t.g7}</th>
                  <th>8<br/>{t.g8}</th>
                  <th>9<br/>{t.s13d}</th>
                  <th>{t.s13n}</th>
                  <th>10<br/>{t.s15}</th>
                  <th>{t.s16}</th>
                  <th>11<br/>{t.s17}</th>
                  <th>{t.s18}</th>
                  <th>{t.s19}</th>
                  <th className="i-g">12<br/>{t.g12}</th>
                  <th className="s-g">13<br/>{t.s21}</th>
                  <th className="s-g">{t.s22}</th>
                  <th className="s-g">{t.s23}</th>
                  <th>14<br/>{t.g14}</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(r=>{
                  const lc=calcFlight(r);
                  return(
                    <tr key={r.id} className="rd">
                      <td>{r.date}</td>
                      <td style={{fontWeight:700}}>{r.acType}</td>
                      <td>{r.reg}</td>
                      <td style={{fontWeight:700}}>{r.from}</td>
                      <td>{r.depTime||""}</td>
                      <td style={{fontWeight:700}}>{r.to}</td>
                      <td>{r.arrTime||""}</td>
                      <td>{r.singleSE||""}</td>
                      <td>{r.singleME||""}</td>
                      <td>{r.multiPilot||""}</td>
                      <td className="c-t">{lc.total>0?hhmm(lc.total):""}</td>
                      <td style={{textAlign:"left",fontSize:"5pt"}}>{r.picName||""}</td>
                      <td className="c-d">{lc.ldgDay>0?lc.ldgDay:""}</td>
                      <td className="c-n">{lc.ldgNight>0?lc.ldgNight:""}</td>
                      <td className="c-n">{lc.night>0?hhmm(lc.night):""}</td>
                      <td>{r.ifr||""}</td>
                      <td style={{fontWeight:700}}>{r.pic||""}</td>
                      <td>{r.coPilot||""}</td>
                      <td>{r.dual||""}</td>
                      <td style={{fontSize:"5pt"}}>{r.instructorName&&<div style={{fontSize:"4pt",lineHeight:1.1}}>{r.instructorName}</div>}{r.instructorTime||""}</td>
                      <td className="s-d" style={{fontSize:"5pt"}}>{r.synDate||""}</td>
                      <td className="s-d" style={{fontSize:"5pt"}}>{r.synType||""}</td>
                      <td className="s-d" style={{fontSize:"5pt"}}>{r.synTime||""}</td>
                      <td style={{textAlign:"left",fontSize:"5pt"}}>{r.remarks||""}</td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr className="rt">
                  <td colSpan={7} style={{textAlign:"right",paddingRight:"1mm"}}>{t.pageTotal}</td>
                  <td>{hhmmBlank(tots.se)}</td><td>{hhmmBlank(tots.me)}</td>
                  <td>{hhmmBlank(tots.mp)}</td>
                  <td className="c-t">{hhmm(tots.total)}</td><td></td>
                  <td className="c-d">{tots.ldgD||""}</td>
                  <td className="c-n">{tots.ldgN||""}</td>
                  <td className="c-n">{hhmmBlank(tots.night)}</td>
                  <td>{hhmmBlank(tots.ifr)}</td>
                  <td>{hhmmBlank(tots.pic)}</td><td>{hhmmBlank(tots.co)}</td><td>{hhmmBlank(tots.dual)}</td>
                  <td></td><td></td><td></td>
                  <td>{tots.synTime>0?hhmm(tots.synTime):""}</td><td></td>
                </tr>
                <tr className="rp">
                  <td colSpan={7} style={{textAlign:"right",paddingRight:"1mm",fontStyle:"italic"}}>
                    {t.prevTotal}{prevTotals.asOfDate?` (${lang==="tr"?"ref":"ref"}: ${prevTotals.asOfDate})`:""}
                  </td>
                  <td>{hhmmBlank(prevMin.se)}</td><td>{hhmmBlank(prevMin.me)}</td>
                  <td>{hhmmBlank(prevMin.mp)}</td>
                  <td className="c-t">{prevMin.total>0?hhmm(prevMin.total):""}</td><td></td>
                  <td className="c-d">{prevMin.ldgD||""}</td>
                  <td className="c-n">{prevMin.ldgN||""}</td>
                  <td className="c-n">{hhmmBlank(prevMin.night)}</td>
                  <td>{hhmmBlank(prevMin.ifr)}</td>
                  <td>{hhmmBlank(prevMin.pic)}</td><td>{hhmmBlank(prevMin.co)}</td><td>{hhmmBlank(prevMin.dual)}</td>
                  <td></td><td></td><td></td>
                  <td>{prevMin.synTime>0?hhmm(prevMin.synTime):""}</td><td></td>
                </tr>
                <tr className="rr">
                  <td colSpan={7} style={{textAlign:"right",paddingRight:"1mm",fontStyle:"italic"}}>{t.grandTotal}</td>
                  <td>{hhmmBlank(grandTots.se)}</td><td>{hhmmBlank(grandTots.me)}</td>
                  <td>{hhmmBlank(grandTots.mp)}</td>
                  <td className="c-t">{hhmm(grandTots.total)}</td><td></td>
                  <td className="c-d">{grandTots.ldgD||""}</td>
                  <td className="c-n">{grandTots.ldgN||""}</td>
                  <td className="c-n">{hhmmBlank(grandTots.night)}</td>
                  <td>{hhmmBlank(grandTots.ifr)}</td>
                  <td>{hhmmBlank(grandTots.pic)}</td><td>{hhmmBlank(grandTots.co)}</td><td>{hhmmBlank(grandTots.dual)}</td>
                  <td></td><td></td><td></td>
                  <td>{grandTots.synTime>0?hhmm(grandTots.synTime):""}</td><td></td>
                </tr>
              </tfoot>
            </table>
            <div className="p-foot">
              <span>SHGM / EASA Part-FCL.050 · AMC1 FCL.050 · Jean Meeus · Per-minute interpolation</span>
              <span>{t.sig}: ___________________________</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  );
}

// ── Micro components ──────────────────────────────────────────────────────────
function HdrInput({label,value,onChange,ph,w}){
  return(
    <div>
      <div style={{fontSize:7,color:"#4a9eff",letterSpacing:1.5,textTransform:"uppercase",marginBottom:3,fontFamily:F}}>{label}</div>
      <input value={value} onChange={onChange} placeholder={ph}
        style={{background:"transparent",border:"none",borderBottom:"1px solid #2a4060",
          color:"#c9d6e8",fontSize:12,outline:"none",width:w,fontFamily:F,padding:"2px 0"}}/>
    </div>
  );
}
function PV({label,val,col}){
  return(
    <div>
      <div style={{fontSize:8,color:"#6a8aaa",marginBottom:2,fontFamily:F}}>{label}</div>
      <div style={{fontSize:15,fontWeight:700,color:col,fontFamily:F}}>{val}</div>
    </div>
  );
}
function Btn({onClick,label,sec,primary}){
  return(
    <button onClick={onClick} style={{
      background:primary?"#1a3a6e":sec?"#f8f9fb":"#e8eef4",
      border:`1.5px solid ${primary?"#3a6aaa":sec?"#c8d4e0":"#a0b8cc"}`,
      color:primary?"#fff":sec?"#6a8aaa":"#1a2a3a",
      padding:"6px 12px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:600,
      height:30,whiteSpace:"nowrap",fontFamily:F}}>
      {label}
    </button>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
<script>
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.print-show').forEach(e=>e.style.display='block');});
window.addEventListener('afterprint',()=>{document.querySelectorAll('.print-show').forEach(e=>e.style.display='none');});
// Service Worker sadece https/localhost altında ve dosya varsa kaydedilir — file:// açılışta hataya sebep olmaz
try{
  if('serviceWorker'in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
}catch(e){/* file:// veya kısıtlı ortamlarda sessizce yok say */}
</script>
</body>
</html>
